name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Exact image tag, for example sha-abc123"
        required: true
        type: string
      dry_run:
        description: "Validate SSH and Compose without restarting services"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          [[ "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]] || {
            echo "Use a full immutable sha-... image tag."
            exit 1
          }

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.PRODUCTION_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy image to existing VM
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          : "${DEPLOY_HOST:?Missing PRODUCTION_HOST secret}"
          : "${DEPLOY_USER:?Missing PRODUCTION_USER secret}"

          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "
            set -eu
            cd /home/q19almaz/sabil-life-backend
            export IMAGE_TAG='${IMAGE_TAG}'
            docker compose -f docker-compose.prod.yml pull backend worker beat
            docker compose -f docker-compose.prod.yml config --quiet

            if [ '${{ inputs.dry_run }}' = 'true' ]; then
              echo 'Dry run completed; no services were restarted.'
              exit 0
            fi

            docker compose -f docker-compose.prod.yml up -d --no-build \
              backend worker beat
            docker compose -f docker-compose.prod.yml ps
          "

      - name: Verify health endpoint
        run: |
          curl --fail --show-error --silent \
            --retry 12 \
            --retry-delay 5 \
            '${{ secrets.PRODUCTION_URL }}/api/v1/core/ping/'
